name: observatorio-eleitoral
services:
  db:
    # PostGIS 3.6 sobre a imagem oficial do PostgreSQL 18.6 Alpine (mesmo diretório de dados e collation): associação local → setor.
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-observatorio}
      POSTGRES_USER: ${POSTGRES_USER:-observatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observatorio_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-observatorio}:${POSTGRES_PASSWORD:-observatorio_local}@db:5432/${POSTGRES_DB:-observatorio}
      API_PORT: 3001
      API_HOST: 0.0.0.0
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      ORIGINALS_DIRECTORY: /data/originals
      AUDIT_DIRECTORY: /data/audit
    volumes:
      - ./data/originals:/data/originals:ro
      - ./data/audit:/data/audit:ro
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Vai para a compilação e fica na imagem; vazia ou ausente, o padrão local.
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    environment:
      API_URL: http://api:3001
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres_data:
